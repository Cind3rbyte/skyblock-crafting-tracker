<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Skyblock Crafting Tracker</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23161b2a'/%3E%3Cpath d='M8 17l5 5 11-12' fill='none' stroke='%2355ffaa' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app" class="wrap">
    <header class="top">
      <div>
        <h1>Skyblock Crafting Tracker</h1>
        <p class="sub">Gemeinsame Materialliste für Hypixel SkyBlock</p>
      </div>
      <div class="status" id="status" aria-live="polite"></div>
    </header>

    <section id="gate" class="card gate" hidden>
      <h2>Gruppen-Passwort</h2>
      <p>Wer dasselbe Passwort eingibt, sieht und bearbeitet dieselbe Liste. Ein neues Passwort startet eine neue, leere Liste.</p>
      <form id="gate-form">
        <input id="gate-input" type="password" autocomplete="current-password" placeholder="Passwort" required>
        <button type="submit" class="btn primary">Öffnen</button>
      </form>
    </section>

    <div id="main" hidden>
      <nav id="tabs" class="tabs" aria-label="Items"></nav>
      <section id="item"></section>
      <footer class="foot">
        <button id="logout" class="link">Passwort wechseln</button>
        <span id="generated"></span>
      </footer>
    </div>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
